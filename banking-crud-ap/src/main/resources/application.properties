spring.application.name=banking-crud-ap

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5434/bankdb
spring.datasource.username=postgres
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT Resource Server ───────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/banking-realm

# ── Keycloak Admin REST API ───────────────────────────────────────────────────
# Uses admin-cli with admin username/password — no service account role config needed.
# realm        = master         (where admin-cli lives)
# target-realm = banking-realm  (where your users and roles are)
keycloak.admin.server-url=http://localhost:8180
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.admin.target-realm=banking-realm

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=DEBUG
