events {
}

http {

    server {

        listen 80;

        # React Frontend
        location / {
            proxy_pass http://frontend:80;
        }

        # Spring Boot Backend
        location /api/ {
            proxy_pass http://backend:8080;
        }

        # Keycloak
        location /auth/ {
            proxy_pass http://keycloak:8080;
        }
    }
}